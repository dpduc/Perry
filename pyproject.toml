[project]
name = "perry"
version = "0.1.0"
description = "A personal multi-agent assistant"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    # Pinned: perry/colbert.py patches one of its private functions (`_load_torch_path`).
    "fast-plaid==1.4.6.2110",
    "gradio>=6.29.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pylate>=1.6.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "langchain-openai>=1.7.0",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "tzlocal>=5.4.4",
]

# ColBERT runs on the CPU: without this, uv pulls the ~2.5 GB CUDA build of torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
