[project]
name = "perry"
version = "0.1.0"
description = "A personal multi-agent assistant"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.29.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
