name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The same image and port as compose.yaml; tests create their own database in it.
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: perry
          POSTGRES_PASSWORD: perry
          POSTGRES_DB: perry
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U perry"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
