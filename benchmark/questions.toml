pages = ["halden-annual-report-2025.pdf#page=3"]
related_pages = ["halden-newsletter-autumn-2025.pdf#page=1", "board-minutes-2025.pdf#page=1"]

[[question]]
id = "L3"
type = "lookup"
question = "What are the payment terms for Tier 2 suppliers?"
