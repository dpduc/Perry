pages = ["supplier-handbook.pdf#page=2"]

[[question]]
id = "L4"
type = "lookup"
question = "How much did Halden pay to acquire Tessel AI?"
facts = ["9.5"]
pages = ["board-minutes-2025.pdf#page=3"]

[[question]]
id = "L5"
type = "lookup"
question = "What was overall engagement in the latest employee survey?"
