# Benchmark question set over the Documents in benchmark/documents/.
#
# type:          lookup | multi_hop | thematic | entity
# facts:         each entry is one expected fact; a list gives acceptable phrasings
#                (matched case-insensitively, thousands separators ignored)
# pages:         source pages the answer must cite
# related_pages: pages that are also correct to cite, but not required

# --- Lookup: one fact on one page ------------------------------------------------

[[question]]
id = "L1"
type = "lookup"
question = "What was Halden Robotics' total revenue in 2025?"
facts = ["84.2"]
pages = ["halden-annual-report-2025.pdf#page=1"]

[[question]]
id = "L2"
type = "lookup"
question = "Where is Halden's second factory and when did it open?"
